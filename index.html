<!doctype html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8">

  <meta property="og:site_name" content="AI &amp; Big Data, DTWG">
  <meta property="og:image" content="https://ai-dtwg.com/assets/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Set theme and effects before first paint. Effects default to off when the visitor prefers reduced motion.
    (function () {
      var d = document.documentElement, fx = null, theme = null;
      try { fx = localStorage.getItem("fx"); theme = localStorage.getItem("theme"); } catch (e) {}
      if (/^(green|amber|ice|paper)$/.test(theme)) d.dataset.theme = theme;
      d.dataset.fx = fx === "on" || fx === "off" ? fx : (matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on");
    })();
  </script>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="term">
    <header class="bar">
      <div class="bar-top">
        <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="bar-title" id="bar-title">guest@ai-bigdata: ~</span>
        <span class="bar-org">AI x DTWG x MPTC</span>
      </div>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-cmd="about">about</button>
        <button type="button" data-cmd="team">team</button>
        <button type="button" data-cmd="projects">projects</button>
        <button type="button" data-cmd="contact">contact</button>
        <button type="button" data-cmd="help">help</button>
      </nav>
    </header>

    <main class="screen" id="screen">
      <div id="out" aria-live="polite"></div>

      <form class="prompt" id="prompt" autocomplete="off">
        <label for="cmd" class="ps1" id="ps1"></label>
        <input id="cmd" name="cmd" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" aria-label="Terminal command. Type help for a list." enterkeyhint="go">
      </form>

      <noscript>
        <p>AI &amp; Big Data is a sub working group of the Digital Transformation Working Group (DTWG) at the
        Ministry of Post and Telecommunications of Cambodia. It works on computer vision, Khmer language technology,
        LLM applications and data analytics. This page needs JavaScript to show the team and projects.</p>
      </noscript>
    </main>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/terminal.js"></script>
  <script type="module" src="assets/js/scene.js"></script>
</body>
</html>
